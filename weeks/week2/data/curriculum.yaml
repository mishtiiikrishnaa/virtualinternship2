modules:
- id: m1
  position: 1
  title: computational thinking and problem decomposition
  duration_minutes: 180
  prerequisites: []
  concepts_introduced:
  - computational thinking
  - algorithm
  - sequence
  - decomposition
  - pseudocode
  concepts_reused: []
  plain_english_summary: before any code, learners describe a task as a clear list
    of steps in plain words.
  analogy:
    text: 'giving directions to a friend who has never seen the street: write the
      steps in order, one after another, no skipping.'
    breaks_down: the friend might read faster than you meant; in code the computer
      cannot improvise.
  worked_example:
    code: "steps = [\n    \"open the diary\",\n    \"turn to page 3\",\n    \"read\
      \ the entry\",\n    \"close the diary\",\n]\nprint(\"recipe made of \" + str(len(steps))\
      \ + \" steps\")\n"
    captured_output: recipe made of 4 steps
    varies_example:
      code: "steps = [\n    \"boil water\",\n    \"add tea bag\",\n    \"wait four\
        \ minutes\",\n    \"add milk\",\n]\nprint(\"recipe made of \" + str(len(steps))\
        \ + \" steps\")\n"
      captured_output: recipe made of 4 steps
  diagram_id: fig-curriculum-map
  activities:
  - activity_id: m1-p1
    type: parsons
    objective_ids:
    - m1-o1
    minutes: 25
  - activity_id: m1-prm
    type: predict-run-modify
    objective_ids:
    - m1-o1
    - m1-o2
    minutes: 20
  - activity_id: m1-a1
    type: pair_task
    objective_ids:
    - m1-o1
    minutes: 25
  misconceptions:
  - id: m1-m1
    wrong_belief: a program is a paragraph of prose
    real_error: no code executed; wrong mental model
    facilitator_response: show a recipe card vs a recipe sentence; code is instruction-like.
  quiz:
  - id: m1-q1
    question: what does a computer program do?
    correct_answer: follows a list of instructions in order
    wrong_options:
    - guesses what you mean
    - thinks creatively
    objective_id: m1-o1
    bloom: remember
  - id: m1-q2
    question: breaking a task into smaller steps is called
    correct_answer: decomposition
    wrong_options:
    - debugging
    - compiling
    objective_id: m1-o1
    bloom: understand
  exit_ticket:
    id: m1-et1
    question: in your own words, what is an algorithm?
    objective_id: m1-o1
    expected_keywords:
    - steps
    - instructions
    - in order
- id: m2
  position: 2
  title: variables and data types
  duration_minutes: 180
  prerequisites:
  - m1
  concepts_introduced:
  - variable
  - assignment
  - string
  - integer
  - float
  - boolean
  - print
  - str
  concepts_reused:
  - algorithm
  - sequence
  plain_english_summary: a variable is a name for a value the program can read and
    change, like a labelled box.
  analogy:
    text: a labelled box where you can put a number or a word, and later take the
      label off and use a different value.
    breaks_down: the box is not a box; reassigning changes what the name points to,
      not the box.
  worked_example:
    code: 'name = "meghana"

      age = 26

      height_cm = 165.5

      print(name)

      print(age)

      print(height_cm)

      '
    captured_output: 'meghana

      26

      165.5'
    varies_example:
      code: 'name = "arjun"

        age = 19

        print("hello " + name + ", you are " + str(age) + " years old")

        '
      captured_output: hello arjun, you are 19 years old
  diagram_id: fig-variable-box
  activities:
  - activity_id: m2-mis
    type: debug-this
    objective_ids:
    - m2-o1
    minutes: 25
  - activity_id: m2-pair
    type: pair_task
    objective_ids:
    - m2-o2
    minutes: 25
  - activity_id: m2-prm
    type: predict-run-modify
    objective_ids:
    - m2-o1
    - m2-o2
    minutes: 20
  quiz:
  - id: m2-q1
    question: what does a variable hold?
    correct_answer: a value that can change
    wrong_options:
    - always the same number
    - a fixed box type
    misconception: variable is a box
    objective_id: m2-o1
    bloom: apply
  - id: m2-q2
    question: what does print show?
    correct_answer: a value to the user
    wrong_options:
    - stores a value
    - fixes a bug
    misconception: print stores
    objective_id: m2-o1
    bloom: apply
- id: m3
  position: 3
  title: input and output
  duration_minutes: 120
  prerequisites:
  - m2
  concepts_introduced:
  - input
  - print
  - prompt
  - display
  - int
  - str
  concepts_reused:
  - variable
  - assignment
  plain_english_summary: 'a program talks to the person through input and output:
    ask, remember, show.'
  analogy:
    text: 'ordering food at a restaurant: you say what you want (input), the kitchen
      writes it down (variable), the waiter brings the dish (output).'
    breaks_down: the kitchen cannot answer follow-up questions; it just follows the
      written ticket.
  worked_example:
    code: 'name = input("what is your name? ")

      age = input("how old are you? ")

      print("hello " + name + ". you will be " + str(int(age) + 1) + " next year.")

      '
    captured_output: hello meghana. you will be 27 next year
    varies_example:
      code: 'city = input("which city are you in? ")

        print("noted: " + city)

        '
      captured_output: 'noted: ahmedabad'
  diagram_id: fig-io
  activities:
  - activity_id: m3-prm
    type: predict-run-modify
    objective_ids:
    - m3-o1
    minutes: 20
  - activity_id: m3-a2
    type: pair_task
    objective_ids:
    - m3-o1
    minutes: 25
  - activity_id: m3-a3
    type: debug-this
    objective_ids:
    - m3-o1
    minutes: 25
  quiz:
  - id: m3-q1
    question: what does input do?
    correct_answer: asks the user and returns typed text
    wrong_options:
    - gives a number
    - saves to a file
    misconception: input gives a number
    objective_id: m3-o1
    bloom: understand
  - id: m3-q2
    question: what does print do?
    correct_answer: shows text to the user
    wrong_options:
    - reads from a file
    - sends an email
    misconception: print reads
    objective_id: m3-o1
    bloom: understand
- id: m4
  position: 4
  title: conditionals (if / else)
  duration_minutes: 180
  prerequisites:
  - m3
  concepts_introduced:
  - if
  - else
  - boolean expression
  - comparison operator
  concepts_reused:
  - variable
  - assignment
  - sequence
  - input
  - print
  plain_english_summary: a program can choose between two or more paths based on a
    condition.
  analogy:
    text: 'a traffic roundabout: if the light is green, go; if red, stop; otherwise
      follow the sign.'
    breaks_down: a roundabout has many roads; an if/else has a binary choice and a
      condition you must write precisely.
  worked_example:
    code: "age = 12\nif age >= 13:\n    print(\"you can watch the scary movie\")\n\
      else:\n    print(\"you must watch the gentle cartoon\")\n"
    captured_output: you must watch the gentle cartoon
    varies_example:
      code: "name = \"fatima\"\nif name == \"fatima\":\n    print(\"welcome back,\
        \ teacher\")\nelse:\n    print(\"hello, stranger\")\n"
      captured_output: welcome back, teacher
  diagram_id: fig-decision-flow
  activities:
  - activity_id: m4-p1
    type: parsons
    objective_ids:
    - m4-o1
    minutes: 25
  - activity_id: m4-prm
    type: predict-run-modify
    objective_ids:
    - m4-o1
    minutes: 20
  - activity_id: m4-a2
    type: pair_task
    objective_ids:
    - m4-o1
    minutes: 25
  quiz:
  - id: m4-q1
    question: what does an if check?
    correct_answer: whether a condition is true
    wrong_options:
    - whether a variable exists
    - whether a file exists
    misconception: if checks existence
    objective_id: m4-o1
    bloom: apply
  - id: m4-q2
    question: what does else mean?
    correct_answer: the other branch when the if is false
    wrong_options:
    - always runs
    - stops the program
    misconception: else always runs
    objective_id: m4-o1
    bloom: apply
- id: m5
  position: 5
  title: loops (repeat)
  duration_minutes: 180
  prerequisites:
  - m4
  concepts_introduced:
  - while
  - for
  - range
  - iteration
  concepts_reused:
  - variable
  - assignment
  - condition
  plain_english_summary: a loop repeats a block of steps until a condition becomes
    false, or for a known number of times.
  analogy:
    text: asking a child to count from one to ten by pointing at each number on a
      number line, one at a time, ten times.
    breaks_down: the number line is physical; a for loop is a counter, and the stop
      condition must be written, not assumed.
  worked_example:
    code: "total = 0\nfor i in range(3):\n    total = total + 1\nprint(total)\n"
    captured_output: '3'
    varies_example:
      code: "count = 0\nwhile count < 3:\n    count = count + 1\nprint(\"done counting\
        \ to \" + str(count))\n"
      captured_output: done counting to 3
  diagram_id: fig-loop-trace
  activities:
  - activity_id: m5-p1
    type: parsons
    objective_ids:
    - m5-o1
    minutes: 25
  - activity_id: m5-prm
    type: predict-run-modify
    objective_ids:
    - m5-o1
    minutes: 20
  - activity_id: m5-a2
    type: pair_task
    objective_ids:
    - m5-o1
    minutes: 25
  quiz:
  - id: m5-q1
    question: what does range(3) give?
    correct_answer: three loop runs
    wrong_options:
    - three values to add
    - three stored items
    misconception: range gives values
    objective_id: m5-o1
    bloom: apply
  - id: m5-q2
    question: when does a while loop stop?
    correct_answer: when the condition becomes false
    wrong_options:
    - after ten runs
    - never
    misconception: while has a default stop
    objective_id: m5-o1
    bloom: apply
- id: m6
  position: 6
  title: functions (reusable steps)
  duration_minutes: 180
  prerequisites:
  - m5
  concepts_introduced:
  - def
  - return
  - parameter
  - argument
  - function call
  concepts_reused:
  - sequence
  - variable
  - algorithm
  plain_english_summary: a function is a named, reusable bundle of steps that takes
    inputs and gives back one output.
  analogy:
    text: 'a vending machine: you press a button (call), the machine follows its internal
      steps (function body), and gives you a snack (return).'
    breaks_down: a vending machine cannot take its own button as input; functions
      take parameters and return one value, not many.
  worked_example:
    code: "def greet(name):\n    return \"hello \" + name + \", welcome back\"\nprint(greet(\"\
      fatima\"))\n"
    captured_output: hello fatima, welcome back
    varies_example:
      code: "def add(a, b):\n    return a + b\nprint(add(2, 3))\n"
      captured_output: '5'
  diagram_id: fig-function-machine
  activities:
  - activity_id: m6-p1
    type: parsons
    objective_ids:
    - m6-o1
    minutes: 25
  - activity_id: m6-prm
    type: predict-run-modify
    objective_ids:
    - m6-o1
    minutes: 20
  - activity_id: m6-a2
    type: pair_task
    objective_ids:
    - m6-o1
    minutes: 25
  quiz:
  - id: m6-q1
    question: what does a function return?
    correct_answer: one value the caller can use
    wrong_options:
    - nothing
    - all variables
    misconception: function returns nothing
    objective_id: m6-o1
    bloom: apply
  - id: m6-q2
    question: what is a parameter?
    correct_answer: a name for an input it receives
    wrong_options:
    - the output
    - the function name
    misconception: parameter is the value
    objective_id: m6-o1
    bloom: apply
- id: m7
  position: 7
  title: lists and dictionaries
  duration_minutes: 180
  prerequisites:
  - m6
  concepts_introduced:
  - list
  - index
  - append
  - dictionary
  - key
  - value
  - iteration over collection
  concepts_reused:
  - variable
  - assignment
  - loop
  - function
  plain_english_summary: 'collections help store many values: a list is an ordered
    pile, a dictionary maps names to values.'
  analogy:
    text: a shopping list (list) and a phone contacts list (dictionary).
    breaks_down: lists keep order and allow duplicates; dictionaries allow any key,
      not just sequential numbers.
  worked_example:
    code: 'shopping = ["rice", "oil", "tea"]

      shopping.append("salt")

      print(shopping[0])

      print(len(shopping))

      contacts = {"meghana": "9876543210", "arjun": "9123456780"}

      print(contacts["meghana"])

      '
    captured_output: 'rice

      3

      9876543210'
    varies_example:
      code: 'scores = [10, 20, 30]

        scores[0] = 11

        print(sum(scores))

        '
      captured_output: '61'
  diagram_id: fig-list-dict
  activities:
  - activity_id: m7-p1
    type: parsons
    objective_ids:
    - m7-o1
    minutes: 25
  - activity_id: m7-prm
    type: predict-run-modify
    objective_ids:
    - m7-o1
    minutes: 20
  - activity_id: m7-a2
    type: pair_task
    objective_ids:
    - m7-o1
    minutes: 25
  quiz:
  - id: m7-q1
    question: what does append do?
    correct_answer: adds one item to the end
    wrong_options:
    - adds at the front
    - removes item
    misconception: append adds at front
    objective_id: m7-o1
    bloom: apply
  - id: m7-q2
    question: how do you read one dictionary value?
    correct_answer: use the key in brackets
    wrong_options:
    - use a number
    - use a dot
    misconception: dot notation for dict
    objective_id: m7-o1
    bloom: apply
- id: m8
  position: 8
  title: files and simple data
  duration_minutes: 180
  prerequisites:
  - m7
  concepts_introduced:
  - open
  - read
  - write
  - with statement
  - print
  - int
  - str
  concepts_reused:
  - variable
  - function
  - list
  plain_english_summary: programs can read what a person wrote in a file and write
    results back into a file.
  analogy:
    text: writing a note on paper and filing it; later reading the note back.
    breaks_down: file handles are stateful and need closing; the with statement automates
      closing safely.
  worked_example:
    code: "with open(\"todo.txt\", \"w\") as f:\n    f.write(\"buy milk\\n\")\nwith\
      \ open(\"todo.txt\", \"r\") as f:\n    print(f.read())\n"
    captured_output: buy milk
    varies_example:
      code: "with open(\"names.txt\", \"w\") as f:\n  f.write(\"meghana\\narjun\\\
        n\")\nwith open(\"names.txt\", \"r\") as f:\n  for line in f:\n    print(line.strip().upper())\n"
      captured_output: 'MEGHANA

        ARJUN'
  diagram_id: fig-file-flow
  activities:
  - activity_id: m8-p1
    type: debug-this
    objective_ids:
    - m8-o1
    minutes: 25
  - activity_id: m8-a2
    type: pair_task
    objective_ids:
    - m8-o1
    minutes: 25
  - activity_id: m8-a3
    type: predict-run-modify
    objective_ids:
    - m8-o1
    minutes: 20
  quiz:
  - id: m8-q1
    question: what does with do?
    correct_answer: opens and closes a file safely
    wrong_options:
    - writes faster
    - reads faster
    misconception: with is optional
    objective_id: m8-o1
    bloom: apply
  - id: m8-q2
    question: what mode writes a file?
    correct_answer: w
    wrong_options:
    - r
    - x
    misconception: mode x is write
    objective_id: m8-o1
    bloom: apply
- id: m9
  position: 9
  title: debugging and reading errors
  duration_minutes: 180
  prerequisites:
  - m1
  - m2
  - m3
  - m4
  - m5
  - m6
  - m7
  - m8
  concepts_introduced:
  - syntax error
  - runtime error
  - logic error
  - traceback
  concepts_reused:
  - variable
  - function
  - loop
  - file
  plain_english_summary: errors are messages from the computer about what went wrong;
    reading them is a skill.
  analogy:
    text: 'a recipe with a wrong ingredient amount: the kitchen stops and tells you
      which step and what is off.'
    breaks_down: the message names a line and a kind, but not always the thinking
      error; you must connect it to your intention.
  worked_example:
    code: 'age = input("how old are you? ")

      print("next year you will be " + str(int(age)) + " years old")

      '
    captured_output: 'Traceback (most recent call last): ValueError: invalid literal
      for int() with base 10: ''abc'''
    varies_example:
      code: "total = 10\nfor i in range(5):\n    total = total + i\nprint(total)\n"
      captured_output: '20'
  diagram_id: fig-traceback
  activities:
  - activity_id: m9-p1
    type: debug-this
    objective_ids:
    - m9-o1
    minutes: 25
  - activity_id: m9-a2
    type: pair_task
    objective_ids:
    - m9-o1
    minutes: 25
  - activity_id: m9-a3
    type: predict-run-modify
    objective_ids:
    - m9-o1
    minutes: 20
  quiz:
  - id: m9-q1
    question: what does a traceback show first?
    correct_answer: the error kind at the end
    wrong_options:
    - the line you wrote first
    - your name
    misconception: traceback reads top-down
    objective_id: m9-o1
    bloom: analyse
  - id: m9-q2
    question: what is a logic error?
    correct_answer: the code runs but gives wrong output
    wrong_options:
    - will not run
    - runs slowly
    misconception: logic error means crash
    objective_id: m9-o1
    bloom: analyse
