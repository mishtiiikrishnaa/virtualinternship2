glossary_terms:
- term: algorithm
  plain: a step-by-step set of instructions that solves a task
- term: boolean
  plain: a true or false value, like yes or no
- term: breakpoint
  plain: a pause point in code where the program stops so you can look at the values
- term: capstone
  plain: the final mini-project where learners combine ideas into one finished program
- term: collection
  plain: a group of values stored together, such as a list or a dictionary
- term: conditional
  plain: a choice in a program that runs different steps depending on the situation
- term: debugging
  plain: finding and fixing mistakes in a program
- term: dictionary
  plain: a collection that pairs each name with a value, like a contacts list
- term: error message
  plain: the computer note that explains what it did not understand or what went wrong
- term: float
  plain: a number with a decimal point, like 3.5
- term: function
  plain: a named, reusable set of steps that does one job
- term: integer
  plain: a whole number, like 5, without a decimal point
- term: input
  plain: how information travels into a program from the user
- term: iteration
  plain: one pass through a loop, where the loop variable takes the next value
- term: list
  plain: an ordered collection of items, like a shopping list
- term: loop
  plain: a structure that repeats steps until a condition changes
- term: module
  plain: one teaching unit, about three hours, that builds on the previous one
- term: Parsons problem
  plain: a task where learners order scrambled lines of code instead of writing from
    scratch
- term: program
  plain: the set of instructions a computer follows, written by a programmer
- term: Python
  plain: the teaching language; it reads clearly and runs in a browser
- term: return
  plain: the value a function sends back to whoever called it
- term: sequence
  plain: the order in which steps happen, one after another
- term: string
  plain: text, like a name or a sentence, written in quotes
- term: syntax error
  plain: a mistake in the shape of a code sentence, so the computer cannot parse it
- term: variable
  plain: a named place that holds a value that can change, like a label on a shelf
research_ids:
- id: R1
  source: mit tll worked examples
  claim: novices benefit from studying a fully worked example with thinking made visible
- id: R2
  source: raspberry pi parsons problems blog
  claim: parsons problems as scrambled-line reordering suit text-based intro languages
- id: R3
  source: kapor foundation parsons strategy guide
  claim: scrambled lines format lowers cognitive load for ordering tasks
- id: R4
  source: lui yap denner pair programming reviews
  claim: pair work helps confidence and accuracy for novices
- id: R5
  source: acm worked examples cognitive load
  claim: worked examples reduce overload by showing steps before asking learners to
    produce them
- id: R6
  source: sweller cognitive load
  claim: worked example effect reduces extraneous load for novices
- id: R7
  source: lister reading tracing novices
  claim: novices benefit from tracing code step by step
- id: R8
  source: qian lehman misconception review
  claim: misconceptions like variable-as-box persist and must be surfaced
- id: R9
  source: py4e tiny steps progression
  claim: small success within minutes sustains motivation
- id: R10
  source: code.org unplugged first
  claim: unplugged activities before blocks support thinking in steps
- id: D1
  source: design decision
  claim: python chosen over scratch and javascript for readability and browser access
- id: D2
  source: design decision
  claim: colab chosen as browser runtime for zero installs
- id: D3
  source: design decision
  claim: 10 modules and 30 teaching hours kept as scope decision
design_decisions:
- id: D1
  decision: teach python in the browser via colab
  rationale: zero installs, fits virtual internship, matches week 1 decision
- id: D2
  decision: 90 minute session shape, 1/3 instruction, 2/3 practice
  rationale: week 1 plan fixed this shape; consistent rhythm for new learners
- id: D3
  decision: capstone pass mark 12 of 16 with correctness at least 2
  rationale: week 1 rubric design, not research-backed
capstone:
  task: build one small useful program from a personal task
  milestones:
  - id: ms-cap-1
    name: 'milestone 1: tiny program with one variable and one output'
    minutes: 60
    objective_ids:
    - m3-o1
    - m6-o1
  - id: ms-cap-2
    name: 'milestone 2: add one conditional or loop'
    minutes: 60
    objective_ids:
    - m4-o1
    - m5-o1
  - id: ms-cap-3
    name: 'milestone 3: add one function or collection'
    minutes: 60
    objective_ids:
    - m6-o1
    - m7-o1
  - id: ms-cap-4
    name: 'milestone 4: add file handling or debugging'
    minutes: 60
    objective_ids:
    - m8-o1
    - m9-o1
  - id: ms-cap-5
    name: 'milestone 5: integrate all and explain in plain words'
    minutes: 60
    objective_ids:
    - m10-o1
  rubric_criteria:
  - id: cap-c1
    name: correctness
    levels:
      '1': does not run
      '2': runs with wrong output
      '3': runs correctly
      '4': runs correctly and handles a small error
  - id: cap-c2
    name: use of ideas
    levels:
      '1': uses none
      '2': uses one idea
      '3': uses three ideas sensibly
      '4': uses all ideas appropriately
  - id: cap-c3
    name: readability
    levels:
      '1': not readable
      '2': barely follows steps
      '3': follows steps in order
      '4': follows steps and names are clear
  - id: cap-c4
    name: explanation
    levels:
      '1': cannot explain
      '2': explains with help
      '3': explains alone
      '4': explains and explains a change
  pass_total: 12
  pass_correctness_min: 2
  pass_threshold_note: learner passes at 12 of 16 total, with correctness at least
    2; neatness alone cannot pass
assessment:
  quiz_per_module: 2
  quiz_minutes: 10
  exit_ticket_per_module: 1
  exit_ticket_minutes: 5
  exercises_per_module: 3
