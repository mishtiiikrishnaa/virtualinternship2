figures:
- id: fig-curriculum-map
  filename: fig1_curriculum_map.png
  type: curriculum map
  caption: curriculum map showing modules, hours and dependencies
  takeaway: each module assumes the one before it; the capstone joins everything.
- id: fig-concept-ladder
  filename: fig2_concept_ladder.png
  type: concept ladder
  caption: concept ladder showing what each module builds on
  takeaway: concepts are introduced once and reused, never re-explained from scratch.
- id: fig-time-allocation
  filename: fig3_time_allocation.png
  type: time allocation chart by activity type
  caption: computed time allocation chart by activity type
  takeaway: most contact time is learner practice, not instructor talk.
- id: fig-alignment-heatmap
  filename: fig4_alignment_heatmap.png
  type: alignment heatmap
  caption: objectives x activities x assessments alignment heatmap
  takeaway: every objective has an activity and an assessment check.
- id: fig-variable-box
  filename: fig5_variable_box.png
  type: variable as labelled box
  caption: variable as a labelled box with before and after of assignment
  takeaway: a variable is a name, not a box.
- id: fig-decision-flow
  filename: fig6_decision_flow.png
  type: decision flowchart
  caption: if / elif / else decision flowchart for an everyday rule
  takeaway: the condition decides which branch runs.
- id: fig-loop-trace
  filename: fig7_loop_trace.png
  type: loop trace
  caption: loop trace following variable values step by step
  takeaway: the loop repeats until the stop condition changes.
- id: fig-function-machine
  filename: fig8_function_machine.png
  type: function machine
  caption: function as machine with inputs, return value and call
  takeaway: a function packages steps and returns one value.
- id: fig-list-dict
  filename: fig9_list_dict.png
  type: list vs dictionary diagram
  caption: list vs dictionary diagram using the same data
  takeaway: a list is ordered; a dictionary maps names to values.
- id: fig-file-flow
  filename: fig10_file_flow.png
  type: file read/write flow
  caption: file read/write flow
  takeaway: files move text in and out of the program.
- id: fig-traceback
  filename: fig11_traceback.png
  type: annotated real traceback
  caption: annotated real traceback pointing out which line to read first
  takeaway: read the last line first; it names the error kind.
- id: fig-capstone
  filename: fig12_capstone.png
  type: capstone architecture and milestone timeline
  caption: capstone architecture and milestone timeline
  takeaway: one small program built in five milestones.
total_teaching_minutes: 1800
